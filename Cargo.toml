[package]
name = "winui-xaml-poc"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
gpui = "0.2"
roxmltree = "0.20"

# Optimize dependencies even in dev builds; gpui is unusably slow fully
# unoptimized (font shaping, layout). Our own crate stays debuggable.
[profile.dev.package."*"]
opt-level = 1
